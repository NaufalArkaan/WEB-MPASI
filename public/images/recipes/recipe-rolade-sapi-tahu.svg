<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-recipe-rolade-sapi-tahu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#ECE2D0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" rx="20" fill="url(#bg-recipe-rolade-sapi-tahu)"/>
  <circle cx="45" cy="40" r="65" fill="#E8B88D" opacity="0.18"/>
  <circle cx="355" cy="180" r="80" fill="#52765B" opacity="0.08"/>
  <g id="illustration">
    <!-- Platter shadow -->
      <ellipse cx="200" cy="180" rx="95" ry="20" fill="#52765B" opacity="0.12"/>
      <!-- Ceramic Plate -->
      <ellipse cx="200" cy="165" rx="90" ry="25" fill="#FFFFFF" stroke="#52765B" stroke-width="3"/>
      <!-- 3 Slices of Rolade -->
      <!-- Left Slice -->
      <ellipse cx="150" cy="135" rx="22" ry="28" fill="#F2D06B" stroke="#52765B" stroke-width="3"/>
      <ellipse cx="150" cy="135" rx="15" ry="21" fill="#7B461D"/>
      <ellipse cx="150" cy="135" rx="8" ry="12" fill="#FAF7F1"/>
      <circle cx="150" cy="135" r="3" fill="#52765B"/>
      <!-- Middle Slice (Front) -->
      <ellipse cx="200" cy="130" rx="24" ry="30" fill="#F2D06B" stroke="#52765B" stroke-width="3.5"/>
      <ellipse cx="200" cy="130" rx="16" ry="22" fill="#7B461D"/>
      <ellipse cx="200" cy="130" rx="9" ry="13" fill="#FAF7F1"/>
      <circle cx="200" cy="130" r="3.5" fill="#52765B"/>
      <!-- Right Slice -->
      <ellipse cx="250" cy="135" rx="22" ry="28" fill="#F2D06B" stroke="#52765B" stroke-width="3"/>
      <ellipse cx="250" cy="135" rx="15" ry="21" fill="#7B461D"/>
      <ellipse cx="250" cy="135" rx="8" ry="12" fill="#FAF7F1"/>
      <circle cx="250" cy="135" r="3" fill="#52765B"/>
      <!-- Parsley leaf garnish -->
      <circle cx="178" cy="150" r="4" fill="#52765B"/>
      <circle cx="222" cy="150" r="4" fill="#52765B"/>
  </g>
</svg>